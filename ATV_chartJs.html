<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dashboard Chart.js</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f3f5f7;
        }

        .graficos {
            display: flex;
            justify-content: space-between;

        }

        .grafico {
            width: 50%;
            background-color: white;
            padding: 15px;
        }
    </style>
</head>

<body>
    <h1>Dashboard de Temperatura e Umidade</h1>

    <div class="graficos">
        <div class="grafico">
            <h2>Gráfico de Linhas</h2>
            <canvas id="graficoLinha"></canvas>
        </div>

        <div class="grafico">
            <h2>Gráfico de Barras</h2>
            <canvas id="graficoBarras"></canvas>
        </div>
    </div>

    <script>
        // Dados do gráfico de linhas
        const horarios = ["12:00", "13:00", "14:00", "15:00", "16:00", "17:00"];
        const temperaturas = [30, 29, 28, 25, 22, 23];
        const umidades = [80, 82, 80, 85, 80, 83];

        // Gráfico de linhas
        new Chart(document.getElementById("graficoLinha"), {
            type: "line",
            data: {
                labels: horarios,
                datasets: [
                    {
                        label: "Temperatura",
                        data: temperaturas,
                        borderColor: "red",
                        backgroundColor: "red"
                    },
                    {
                        label: "Umidade",
                        data: umidades,
                        borderColor: "blue",
                        backgroundColor: "blue"
                    }
                ]
            }
        });

        // Dados do gráfico de barras
        const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho"];
        const temperaturaMedia = [22, 24, 27, 23, 20, 18];
        const umidadeMedia = [90, 89, 93, 87, 88, 82];

        // Gráfico de barras
        new Chart(document.getElementById("graficoBarras"), {
            type: "bar",
            data: {
                labels: meses,
                datasets: [
                    {
                        label: "Temperatura Média",
                        data: temperaturaMedia,
                        backgroundColor: "red"
                    },
                    {
                        label: "Umidade Média",
                        data: umidadeMedia,
                        backgroundColor: "blue"
                    }
                ]
            }
        });
    </script>
</body>

</html>
